<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>دستیار فنی برق | جهان فولاد سیرجان</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#27384d;font-family:Vazirmatn,Tahoma,sans-serif}
header{background:#1254c2;color:white;text-align:center;padding:28px 16px}h1{font-size:23px;margin:0 0 7px}header p{margin:0;font-size:14px}
main{max-width:600px;margin:auto;padding:24px 18px}h2{text-align:center;font-size:17px;margin:0 0 22px}
.tile{display:block;width:100%;border:0;border-radius:14px;background:#2a558d;color:white;text-align:right;padding:18px 20px;margin:12px 0;font:inherit;cursor:pointer;box-shadow:0 4px 12px #183a641a}
.tile strong{display:block;font-size:18px}.tile span{font-size:13px;opacity:.92}.tile:focus-visible{outline:3px solid #ff001b;outline-offset:2px}
.panel{display:none;background:white;padding:20px;border-radius:14px;margin-top:20px;line-height:2;box-shadow:0 2px 12px #183a640d}
.panel h3{margin:0 0 8px;color:#1254c2}textarea{width:100%;min-height:110px;border:1px solid #bbc7d6;border-radius:10px;padding:12px;font:inherit;resize:vertical}
.hint{font-size:13px;color:#586b80}.status{padding:12px;background:#f3f5fa;border-radius:9px;font-size:14px}
footer{text-align:center;color:#66788a;font-size:12px;padding:22px}
</style></head><body>
<header><h1>دستیار فنی برق</h1><p>جهان فولاد سیرجان</p></header>
<main><h2>سامانه مستندات فنی و مهندسی برق</h2>
<button class="tile" onclick="openPanel('drawings')"><strong>نقشه‌خوانی</strong><span>نقشه‌ها و مدارک الکتریکی</span></button>
<button class="tile" onclick="openPanel('drives')"><strong>منوال درایوها</strong><span>راهنماها و پارامترهای درایو</span></button>
<button class="tile" onclick="openPanel('plc')"><strong>برنامه PLC</strong><span>برنامه‌ها و منطق کنترل</span></button>
<button class="tile" onclick="openPanel('assistant')"><strong>دستیار هوشمند عیب‌یابی</strong><span>پرسش درباره خطاها، اینترلاک‌ها و تجهیزات</span></button>
<section id="panel" class="panel" aria-live="polite"></section>
</main><footer>نسخه نمایشی — بدون اتصال به مدارک یا هوش مصنوعی</footer>
<script>
const pages={
drawings:['نقشه‌خوانی','در نسخه بعد نقشه‌های الکتریکی تجهیزات در این بخش قرار می‌گیرند.'],
drives:['منوال درایوها','در نسخه بعد منوال‌ها و پارامترهای درایوها در این بخش قرار می‌گیرند.'],
plc:['برنامه PLC','در نسخه بعد فایل‌ها و مستندات برنامه PLC در این بخش قرار می‌گیرند.']
};
function openPanel(key){
 const panel=document.getElementById('panel');panel.style.display='block';
 panel.replaceChildren();
 const title=document.createElement('h3');const desc=document.createElement('p');
 if(key==='assistant'){
 title.textContent='دستیار هوشمند عیب‌یابی';
 desc.textContent='نمونه سؤال: موتور پمپ شماره ۲ استارت نمی‌خورد؛ کدام اینترلاک‌ها ممکن است مانع باشند؟';
 const input=document.createElement('textarea');input.placeholder='سؤال فنی خود را اینجا بنویسید...';input.setAttribute('aria-label','سؤال فنی');
 const hint=document.createElement('p');hint.className='hint';hint.textContent='این بخش فعلاً پیش‌نمایش است. پرسش‌ها ارسال یا تحلیل نمی‌شوند؛ اتصال به مدارک و مدل هوش مصنوعی در مراحل بعد انجام می‌شود.';
 panel.append(title,desc,input,hint);
 }else{title.textContent=pages[key][0];desc.textContent=pages[key][1];panel.append(title,desc);}
 panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}
</script></body></html>
